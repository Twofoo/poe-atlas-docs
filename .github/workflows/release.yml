name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer and portable exe
        run: |
          npm run build
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Build SBOM (CycloneDX)
        shell: bash
        run: npm sbom --sbom-format cyclonedx > release/sbom.cdx.json

      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release/*.exe'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          if-no-files-found: error
          path: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.cdx.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/SHA256SUMS.txt
            release/sbom.cdx.json
          generate_release_notes: true
          append_body: true
          body: |
            ## Code signing policy

            Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).

            ## Verifying your download

            Every file has a SHA-256 hash in `SHA256SUMS.txt`. To check your download:

            ```powershell
            Get-FileHash ".\PoE.Atlas.Docs.Setup.x.y.z.exe" -Algorithm SHA256
            ```

            The releases are built in GitHub Actions, so you can also verify the build provenance:

            ```bash
            gh attestation verify "PoE.Atlas.Docs.Setup.x.y.z.exe" --repo Twofoo/poe-atlas-docs
            ```
